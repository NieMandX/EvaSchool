<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c5dae2">
  <meta name="description" content="Контур — географическая викторина с интерактивным глобусом.">
  <title>Контур — географическая викторина</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23d0e0e4'/%3E%3Cg stroke='%23123139' fill='none' stroke-width='1.8'%3E%3Ccircle cx='20' cy='20' r='13'/%3E%3Cellipse cx='20' cy='20' rx='6' ry='13'/%3E%3Cpath d='M7 20h26M10 12h20M10 28h20'/%3E%3C/g%3E%3C/svg%3E">
  <!-- styles -->
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13"/><ellipse cx="16" cy="16" rx="6" ry="13"/><path d="M3 16h26M6 8.5c5 2 15 2 20 0M6 23.5c5-2 15-2 20 0"/></svg></span>
        <span>Контур</span>
        <a class="map-credit" href="https://github.com/NieMandX/EvaSchool#данные-карты" target="_blank" rel="noopener" title="Данные карты · world-countries, ODbL 1.0" aria-label="Данные карты · world-countries, ODbL 1.0">ODbL</a>
      </div>
      <div class="progress" aria-label="Ход игры">
        <span id="progress-label">1 из 10</span>
        <div id="progress-track" class="progress-track" aria-hidden="true"></div>
      </div>
    </header>

    <main class="game">
      <section class="prompt" aria-labelledby="question">
        <h1 id="question" aria-live="polite" aria-atomic="true">
          <span id="question-view" class="question-view">
            <span id="question-lead" class="question-lead">Найди на глобусе</span>
            <span class="country-slot"><span id="country" class="country">Китай</span></span>
          </span>
        </h1>
        <div class="actions">
          <button id="hint" class="button" type="button" aria-expanded="false" aria-controls="feedback">
            <svg aria-hidden="true"><use href="#icon-bulb"/></svg><span>Подсказка</span>
          </button>
          <button id="skip" class="button" type="button">
            <span>Пропустить</span><svg aria-hidden="true"><use href="#icon-arrow"/></svg>
          </button>
          <button id="primary" class="button" type="button" hidden>
            <span></span><svg aria-hidden="true"><use href="#icon-arrow"/></svg>
          </button>
        </div>
        <p id="feedback" class="feedback" role="status" aria-atomic="true"></p>
      </section>

      <section class="stage" aria-label="Игра на глобусе">
        <p id="keyboard-help" class="sr-only">Потяни глобус, чтобы повернуть его, и нажми на страну. С клавиатуры вращай глобус стрелками, меняй масштаб клавишами плюс и минус. Нажми Enter, чтобы выбрать страну в центре. Home возвращает начальный вид.</p>
        <canvas id="globe" aria-hidden="true"></canvas>
        <canvas id="selection" tabindex="0" aria-label="Интерактивный глобус" aria-describedby="keyboard-help"></canvas>
        <span class="crosshair" aria-hidden="true"></span>
        <div id="globe-input" class="globe-input" aria-hidden="true"></div>
        <div class="map-controls" aria-label="Управление глобусом" role="group">
          <button id="zoom-in" class="map-button" type="button" aria-label="Приблизить" title="Приблизить"><svg aria-hidden="true"><use href="#icon-plus"/></svg></button>
          <button id="zoom-out" class="map-button" type="button" aria-label="Отдалить" title="Отдалить"><svg aria-hidden="true"><use href="#icon-minus"/></svg></button>
          <button id="reset" class="map-button reset" type="button" aria-label="Начальный вид" title="Начальный вид"><svg aria-hidden="true"><use href="#icon-reset"/></svg></button>
        </div>
      </section>
    </main>
  </div>

  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="icon-reset" viewBox="0 0 24 24"><path d="M21 5v6h-6m5.7-.7A9 9 0 1 0 21 15"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M3 12h17m-6-6 6 6-6 6"/></symbol>
    <symbol id="icon-bulb" viewBox="0 0 24 24"><path d="M8.5 17.5c0-2.3-2.5-3.2-2.5-6.5a6 6 0 0 1 12 0c0 3.3-2.5 4.2-2.5 6.5M9 18h6m-5 3h4M12 1v1M3.2 4.7l1 1m15.6 0 1-1"/></symbol>
  </svg>
  <!-- scripts -->
</body>
</html>
