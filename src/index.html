<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c5dae2">
  <meta name="description" content="Контур — географическая викторина с интерактивным глобусом.">
  <title>Контур — географическая викторина</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23d0e0e4'/%3E%3Cg stroke='%23123139' fill='none' stroke-width='1.8'%3E%3Ccircle cx='20' cy='20' r='13'/%3E%3Cellipse cx='20' cy='20' rx='6' ry='13'/%3E%3Cpath d='M7 20h26M10 12h20M10 28h20'/%3E%3C/g%3E%3C/svg%3E">
  <!-- styles -->
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div id="progress" class="progress" role="progressbar" aria-label="Ход игры" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1" aria-valuetext="Задание 1 из 10">
        <div id="progress-track" class="progress-track" aria-hidden="true"></div>
      </div>
    </header>

    <main class="game">
      <section class="prompt" aria-labelledby="question">
        <h1 id="question" aria-live="polite" aria-atomic="true">
          <span id="question-view" class="question-view">
            <span class="country-slot"><span id="country" class="country">Китай</span></span>
          </span>
        </h1>
        <div class="actions">
          <button id="hint" class="button" type="button" aria-expanded="false" aria-controls="feedback hint-options">Подсказка</button>
          <button id="primary" class="button" type="button" hidden>
            <span></span><svg aria-hidden="true"><use href="#icon-arrow"/></svg>
          </button>
        </div>
        <p id="feedback" class="feedback" role="status" aria-atomic="true"></p>
        <div id="hint-options" class="hint-options" hidden>
          <button id="skip" class="hint-link" type="button">Показать ответ</button>
          <a class="hint-link" href="https://github.com/NieMandX/EvaSchool#данные-карты" target="_blank" rel="noopener" aria-label="Данные карты · world-countries, ODbL 1.0">Данные карты · ODbL</a>
        </div>
      </section>

      <section class="stage" aria-label="Игра на глобусе">
        <p id="keyboard-help" class="sr-only">Потяни глобус, чтобы повернуть его, и нажми на страну. С клавиатуры вращай глобус стрелками, меняй масштаб клавишами плюс и минус. Нажми Enter, чтобы выбрать страну в центре. Home возвращает начальный вид.</p>
        <canvas id="globe" aria-hidden="true"></canvas>
        <canvas id="selection" tabindex="0" aria-label="Интерактивный глобус" aria-describedby="keyboard-help"></canvas>
        <span class="crosshair" aria-hidden="true"></span>
        <div id="globe-input" class="globe-input" aria-hidden="true"></div>
      </section>
    </main>
  </div>

  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M3 12h17m-6-6 6 6-6 6"/></symbol>
  </svg>
  <!-- scripts -->
</body>
</html>
